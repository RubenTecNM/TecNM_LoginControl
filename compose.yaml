name: tecnm-logincontrol
services:
  backend:
    build: ./backend
    container_name: ${TECNM_BACKEND_CONTAINER_NAME:-TecNM_LoginControl_Backend}
    env_file: ./backend/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /https/localhost.key
      Cors__AllowedOrigins: https://localhost:${TECNM_FRONTEND_PORT:-5173},https://127.0.0.1:${TECNM_FRONTEND_PORT:-5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TECNM_BACKEND_PORT:-7001}:8081"
    volumes:
      - ./.docker/certs:/https:ro
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: ${TECNM_FRONTEND_CONTAINER_NAME:-TecNM_LoginControl_Frontend}
    ports:
      - "${TECNM_FRONTEND_PORT:-5173}:443"
    volumes:
      - ./.docker/certs:/https:ro
    restart: unless-stopped
